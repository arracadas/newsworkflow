[project]
name = "newsworkflow"
version = "0.1.0"
description = "Mistral Workflow that finds relevant, credible news for up to three user-selected topics."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mistralai-workflows[mistralai]>=3.10",
    "pydantic>=2.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
pythonpath = ["apps/worker/src"]
asyncio_mode = "auto"
testpaths = ["tests"]
